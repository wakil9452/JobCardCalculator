<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Card Time Calculator & Excel Generator - BLW</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Flatpickr CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <!-- SheetJS for Excel Download -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex flex-col items-center">

    <div class="bg-white shadow-2xl rounded-2xl p-6 w-full max-w-4xl">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-1">Job Card Time Calculator</h1>
        <p class="text-center bg-orange-200 text-indigo-900 font-semibold py-1 rounded mb-6 text-sm">
            Heavy Machine Shop, BLW Varanasi
        </p>

        <!-- User/Staff Info Form -->
        <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-100 mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Staff Number</label>
                <input type="text" id="staffNo" value="13038" class="w-full p-2 border rounded font-semibold text-gray-800 bg-white">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Month (MM)</label>
                <input type="text" id="jobMonth" value="09" maxlength="2" class="w-full p-2 border rounded font-semibold text-gray-800 bg-white">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Year (YY)</label>
                <input type="text" id="jobYear" value="26" maxlength="2" class="w-full p-2 border rounded font-semibold text-gray-800 bg-white">
            </div>
        </div>

        <form id="jobForm" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium">Assigned Hours</label>
                    <input type="number" id="assignedHours" value="155" min="0" class="w-full p-2 border rounded" required>
                </div>
                <div>
                    <label class="block text-sm font-medium">Assigned Minutes</label>
                    <input type="number" id="assignedMinutes" value="0" min="0" max="59" class="w-full p-2 border rounded" required>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium">Initial Shift</label>
                    <select id="shift" class="w-full p-2 border rounded">
                        <option value="night">Night Shift</option>
                        <option value="day">Day Shift</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium">Start Date (DD-MM-YYYY)</label>
                    <input type="text" id="dateIn" class="w-full p-2 border rounded bg-white" placeholder="Select Start Date" required>
                </div>
                <div>
                    <label class="block text-sm font-medium">Start Time</label>
                    <input type="time" id="timeIn" value="00:10" class="w-full p-2 border rounded" required>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium">Holidays / Leave (Multi-Select Dates)</label>
                <input type="text" id="holidays" class="w-full p-2 border rounded bg-white" placeholder="Select Holidays / Leaves">
            </div>

            <div class="grid grid-cols-2 gap-4 border-t pt-2">
                <div>
                    <label class="block text-sm font-medium">Shift Change Date (Optional)</label>
                    <input type="text" id="shiftChangeDate" class="w-full p-2 border rounded bg-white" placeholder="Select Date">
                </div>
                <div>
                    <label class="block text-sm font-medium">New Shift</label>
                    <select id="shiftChange" class="w-full p-2 border rounded">
                        <option value="day">Day Shift</option>
                        <option value="night">Night Shift</option>
                    </select>
                </div>
            </div>

            <div class="flex gap-4">
                <button type="submit" class="flex-1 bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition">
                    Calculate & View Breakdown
                </button>
            </div>
        </form>

        <!-- Result Box -->
        <div id="result" class="mt-6 p-4 bg-indigo-50 border border-indigo-200 rounded-lg hidden space-y-3">
            <div class="flex justify-between items-center border-b pb-2">
                <span class="text-xs font-bold text-gray-500 uppercase">Generated Serial No:</span>
                <span id="cardSerialText" class="text-sm font-extrabold text-indigo-900 bg-indigo-100 px-3 py-1 rounded-full"></span>
            </div>
            <p><strong>Actual Hours to Fill (2/3):</strong> <span id="actualHoursText" class="font-bold text-indigo-900"></span></p>
            <p><strong>Start Date & Time:</strong> <span id="inTimeText"></span></p>
            <div>
                <h3 class="font-bold mb-1">Work Schedule Breakdown:</h3>
                <ul id="breakdownList" class="list-disc list-inside text-sm text-gray-700 max-h-60 overflow-y-auto bg-white p-2 border rounded font-mono"></ul>
            </div>
            <p class="text-center font-bold text-lg text-indigo-900 pt-2 border-t">
                Optimal Out Time: <span id="outTimeText"></span>
            </p>

            <button id="addCardBtn" class="w-full bg-green-600 text-white font-bold py-2 rounded-lg hover:bg-green-700 transition mt-2">
                + Add This Job Card To Monthly List
            </button>
        </div>

        <!-- Saved Job Cards Table & Export Section -->
        <div id="savedCardsSection" class="mt-8 border-t pt-6 hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-gray-800">Saved Job Cards for Monthly Export (<span id="cardCount">0</span>)</h2>
                <button id="exportExcelBtn" class="bg-emerald-600 text-white font-bold px-4 py-2 rounded-lg hover:bg-emerald-700 transition flex items-center gap-2">
                    📊 Export All Job Cards to Excel (.xlsx)
                </button>
            </div>
            <div class="overflow-x-auto bg-white border rounded-lg">
                <table class="w-full text-xs text-left text-gray-600">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-100 border-b">
                        <tr>
                            <th class="py-2 px-3">Serial No</th>
                            <th class="py-2 px-3">Assigned Time</th>
                            <th class="py-2 px-3">Actual (2/3)</th>
                            <th class="py-2 px-3">Start Time</th>
                            <th class="py-2 px-3">Out Time</th>
                            <th class="py-2 px-3">Action</th>
                        </tr>
                    </thead>
                    <tbody id="cardsTableBody"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        let dateInPicker, shiftChangePicker, holidaysPicker;
        let jobCardsList = [];
        let currentCalculatedCard = null;

        document.addEventListener("DOMContentLoaded", function () {
            dateInPicker = flatpickr("#dateIn", {
                dateFormat: "d-m-Y",
                defaultDate: "08-09-2026"
            });

            shiftChangePicker = flatpickr("#shiftChangeDate", {
                dateFormat: "d-m-Y",
                defaultDate: "22-09-2026"
            });

            holidaysPicker = flatpickr("#holidays", {
                mode: "multiple",
                dateFormat: "d-m-Y",
                defaultDate: ["17-09-2026", "18-09-2026"]
            });
        });

        function formatMinutes(totalMins) {
            const h = Math.floor(totalMins / 60);
            const m = Math.round(totalMins % 60);
            let res = [];
            if (h > 0) res.push(`${h} hour${h > 1 ? 's' : ''}`);
            if (m > 0) res.push(`${m} minute${m > 1 ? 's' : ''}`);
            return res.join(' and ') || '0 minutes';
        }

        function parseDDMMYYYY(dateStr) {
            if (!dateStr) return null;
            const parts = dateStr.split('-');
            if (parts.length !== 3) return null;
            return `${parts[2]}-${parts[1]}-${parts[0]}`;
        }

        function formatDisplayDate(dateObj) {
            const d = String(dateObj.getDate()).padStart(2, '0');
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const y = dateObj.getFullYear();
            const dayName = new Intl.DateTimeFormat('en-US', { weekday: 'short' }).format(dateObj);
            return `${dayName} ${d}-${m}-${y}`;
        }

        function formatDateTimeOut(dateObj) {
            const d = String(dateObj.getDate()).padStart(2, '0');
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const y = dateObj.getFullYear();
            const dayName = new Intl.DateTimeFormat('en-US', { weekday: 'long' }).format(dateObj);
            const hh = String(dateObj.getHours()).padStart(2, '0');
            const mm = String(dateObj.getMinutes()).padStart(2, '0');
            return `${dayName}, ${d}-${m}-${y} at ${hh}:${mm} hrs`;
        }

        document.getElementById('jobForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const inputHrs = parseFloat(document.getElementById('assignedHours').value) || 0;
            const inputMins = parseFloat(document.getElementById('assignedMinutes').value) || 0;
            let remainingMins = Math.round(((inputHrs * 60) + inputMins) * (2 / 3));

            const rawStartDate = document.getElementById('dateIn').value;
            const startTimeStr = document.getElementById('timeIn').value;
            const startDateIso = parseDDMMYYYY(rawStartDate);

            const rawHolidays = document.getElementById('holidays').value;
            const holidaysIsoList = rawHolidays ? rawHolidays.split(',').map(s => parseDDMMYYYY(s.trim())) : [];

            const rawShiftChangeDate = document.getElementById('shiftChangeDate').value;
            const shiftChangeIso = parseDDMMYYYY(rawShiftChangeDate);

            const newShift = document.getElementById('shiftChange').value;
            const initialShift = document.getElementById('shift').value;

            let current = new Date(`${startDateIso}T${startTimeStr}:00`);
            const startInTime = new Date(current);

            // Daily tracking dictionary for combining lunch split lines
            let dailyEntries = {};

            function addDailyWork(dateLabel, shiftName, minsWorked, startHM, endHM) {
                if (!dailyEntries[dateLabel]) {
                    dailyEntries[dateLabel] = {
                        shift: shiftName,
                        totalMins: 0,
                        startHM: startHM,
                        endHM: endHM,
                        isOff: false
                    };
                }
                dailyEntries[dateLabel].totalMins += minsWorked;
                dailyEntries[dateLabel].endHM = endHM; // update end time
            }

            function addDailyOff(dateLabel, reason) {
                dailyEntries[dateLabel] = {
                    isOff: true,
                    reason: reason
                };
            }

            while (remainingMins > 0) {
                const year = current.getFullYear();
                const month = String(current.getMonth() + 1).padStart(2, '0');
                const day = String(current.getDate()).padStart(2, '0');
                const dateStrIso = `${year}-${month}-${day}`;
                const dayOfWeek = current.getDay();

                let currentShift = (shiftChangeIso && dateStrIso >= shiftChangeIso) ? newShift : initialShift;

                // Off-days (Sunday / Holiday)
                if (dayOfWeek === 0 || holidaysIsoList.includes(dateStrIso)) {
                    let dayLabel = formatDisplayDate(current);
                    addDailyOff(dayLabel, dayOfWeek === 0 ? "Sunday - Duty Off" : "Holiday - Duty Off");

                    current.setDate(current.getDate() + 1);
                    current.setHours(currentShift === 'night' ? 16 : 6, currentShift === 'night' ? 0 : 30, 0, 0);
                    continue;
                }

                // Midnight portion for Night Shift (00:00 - 01:30)
                let minsFromMidnight = current.getHours() * 60 + current.getMinutes();
                if (currentShift === 'night' && minsFromMidnight < 90) {
                    let avail = 90 - minsFromMidnight;
                    let worked = Math.min(remainingMins, avail);
                    remainingMins -= worked;

                    let prevDate = new Date(current);
                    prevDate.setDate(prevDate.getDate() - 1);
                    let dayLabel = formatDisplayDate(prevDate);

                    let startHM = startTimeStr;
                    let endMins = minsFromMidnight + worked;
                    let endHM = `${String(Math.floor(endMins / 60)).padStart(2, '0')}:${String(endMins % 60).padStart(2, '0')}`;

                    addDailyWork(dayLabel, "Night Shift", worked, startHM, endHM);

                    current.setMinutes(current.getMinutes() + worked);

                    if (remainingMins > 0) {
                        current.setHours(16, 0, 0, 0);
                    }
                    continue;
                }

                // Regular Shifts
                if (currentShift === 'night') {
                    if (dayOfWeek === 6) { // Saturday Night: 12:00 - 17:30 (5.5 hrs / 330 mins)
                        let avail = 330;
                        let worked = Math.min(remainingMins, avail);
                        remainingMins -= worked;

                        let dayLabel = formatDisplayDate(current);
                        addDailyWork(dayLabel, "Night Shift", worked, "12:00", "17:30");

                        current.setMinutes(current.getMinutes() + worked);
                        if (remainingMins > 0) {
                            current.setDate(current.getDate() + 1);
                            current.setHours(16, 0, 0, 0);
                        }
                    } else { // Weekday Night: 16:00 - 21:00 & 22:00 - 01:30
                        let dayLabel = formatDisplayDate(current);

                        if (minsFromMidnight < 1260) {
                            let avail1 = 1260 - Math.max(minsFromMidnight, 960);
                            let worked1 = Math.min(remainingMins, avail1);
                            remainingMins -= worked1;

                            let startHM = "16:00";
                            let endMins = 960 + worked1;
                            let endHM = `${String(Math.floor(endMins / 60)).padStart(2, '0')}:${String(endMins % 60).padStart(2, '0')}`;

                            addDailyWork(dayLabel, "Night Shift", worked1, startHM, endHM);

                            current.setMinutes(current.getMinutes() + worked1);

                            if (current.getHours() === 21) {
                                current.setHours(22, 0, 0, 0); // Lunch Skip
                            }
                        }

                        if (remainingMins > 0 && current.getHours() >= 22) {
                            let minsNow = current.getHours() * 60 + current.getMinutes();
                            let avail2 = 1530 - minsNow; // up to 01:30 AM next day
                            let worked2 = Math.min(remainingMins, avail2);
                            remainingMins -= worked2;

                            let endMins = minsNow + worked2;
                            let endHH = Math.floor(endMins / 60);
                            let endMM = endMins % 60;
                            if (endHH >= 24) endHH -= 24;
                            let endHM = `${String(endHH).padStart(2, '0')}:${String(endMM).padStart(2, '0')}`;

                            addDailyWork(dayLabel, "Night Shift", worked2, "16:00", endHM);

                            current.setMinutes(current.getMinutes() + worked2);

                            if (remainingMins > 0) {
                                current.setDate(current.getDate() + 1);
                                current.setHours(16, 0, 0, 0);
                            }
                        }
                    }
                } else { // Day Shift
                    if (dayOfWeek === 6) { // Saturday Day: 06:30 - 12:00 (5.5 hrs / 330 mins)
                        let avail = 330;
                        let worked = Math.min(remainingMins, avail);
                        remainingMins -= worked;

                        let dayLabel = formatDisplayDate(current);
                        addDailyWork(dayLabel, "Day Shift", worked, "06:30", "12:00");

                        current.setMinutes(current.getMinutes() + worked);
                        if (remainingMins > 0) {
                            current.setDate(current.getDate() + 1);
                            current.setHours(6, 30, 0, 0);
                        }
                    } else { // Weekday Day: 06:30 - 11:30 & 12:30 - 16:00
                        let dayLabel = formatDisplayDate(current);

                        if (minsFromMidnight < 690) {
                            let avail1 = 690 - Math.max(minsFromMidnight, 390);
                            let worked1 = Math.min(remainingMins, avail1);
                            remainingMins -= worked1;

                            let endMins = 390 + worked1;
                            let endHM = `${String(Math.floor(endMins / 60)).padStart(2, '0')}:${String(endMins % 60).padStart(2, '0')}`;

                            addDailyWork(dayLabel, "Day Shift", worked1, "06:30", endHM);

                            current.setMinutes(current.getMinutes() + worked1);

                            if (current.getHours() === 11 && current.getMinutes() === 30) {
                                current.setHours(12, 30, 0, 0); // Lunch Skip
                            }
                        }

                        if (remainingMins > 0 && (current.getHours() * 60 + current.getMinutes()) >= 750) {
                            let minsNow = current.getHours() * 60 + current.getMinutes();
                            let avail2 = 960 - minsNow;
                            let worked2 = Math.min(remainingMins, avail2);
                            remainingMins -= worked2;

                            let endMins = minsNow + worked2;
                            let endHM = `${String(Math.floor(endMins / 60)).padStart(2, '0')}:${String(endMins % 60).padStart(2, '0')}`;

                            addDailyWork(dayLabel, "Day Shift", worked2, "06:30", endHM);

                            current.setMinutes(current.getMinutes() + worked2);

                            if (remainingMins > 0) {
                                current.setDate(current.getDate() + 1);
                                current.setHours(6, 30, 0, 0);
                            }
                        }
                    }
                }
            }

            // Generate Serial Number
            const staffNo = document.getElementById('staffNo').value.trim() || '13038';
            const mm = document.getElementById('jobMonth').value.trim() || '09';
            const yy = document.getElementById('jobYear').value.trim() || '26';
            const nextCardNo = String(jobCardsList.length + 1).padStart(2, '0');
            const serialNo = `${staffNo}-${mm}-${yy}-${nextCardNo}`;

            // Build Breakdown Text Array
            const breakdownFormatted = [];
            for (let dayKey in dailyEntries) {
                let entry = dailyEntries[dayKey];
                if (entry.isOff) {
                    breakdownFormatted.push(`${dayKey}: ${entry.reason}`);
                } else {
                    breakdownFormatted.push(`${dayKey}: ${entry.shift} — Worked ${formatMinutes(entry.totalMins)} (${entry.startHM}–${entry.endHM})`);
                }
            }

            // Store Current Calculated Job Card Data
            currentCalculatedCard = {
                serialNo: serialNo,
                assignedTime: `${inputHrs} hrs ${inputMins} mins`,
                actualTime: formatMinutes(Math.round(((inputHrs * 60) + inputMins) * (2 / 3))),
                startTime: `${rawStartDate} ${startTimeStr}`,
                outTime: formatDateTimeOut(current),
                breakdown: breakdownFormatted
            };

            // Display Results in UI
            document.getElementById('cardSerialText').textContent = serialNo;
            document.getElementById('actualHoursText').textContent = currentCalculatedCard.actualTime;
            document.getElementById('inTimeText').textContent = currentCalculatedCard.startTime;
            document.getElementById('outTimeText').textContent = currentCalculatedCard.outTime;

            const breakdownUI = document.getElementById('breakdownList');
            breakdownUI.innerHTML = breakdownFormatted.map(item => `<li>${item}</li>`).join('');

            document.getElementById('result').classList.remove('hidden');
        });

        // Add Card to Monthly Export List
        document.getElementById('addCardBtn').addEventListener('click', function() {
            if (!currentCalculatedCard) return;

            jobCardsList.push({...currentCalculatedCard});
            currentCalculatedCard = null;

            document.getElementById('result').classList.add('hidden');
            renderCardsTable();
        });

        function renderCardsTable() {
            const tableBody = document.getElementById('cardsTableBody');
            const container = document.getElementById('savedCardsSection');

            if (jobCardsList.length === 0) {
                container.classList.add('hidden');
                return;
            }

            container.classList.remove('hidden');
            document.getElementById('cardCount').textContent = jobCardsList.length;

            tableBody.innerHTML = jobCardsList.map((card, index) => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="py-2 px-3 font-bold text-indigo-900">${card.serialNo}</td>
                    <td class="py-2 px-3">${card.assignedTime}</td>
                    <td class="py-2 px-3 font-semibold text-green-700">${card.actualTime}</td>
                    <td class="py-2 px-3">${card.startTime}</td>
                    <td class="py-2 px-3 font-semibold">${card.outTime}</td>
                    <td class="py-2 px-3">
                        <button onclick="removeCard(${index})" class="text-red-600 font-bold hover:underline">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function removeCard(index) {
            jobCardsList.splice(index, 1);
            // Re-index Serial Numbers
            const staffNo = document.getElementById('staffNo').value.trim() || '13038';
            const mm = document.getElementById('jobMonth').value.trim() || '09';
            const yy = document.getElementById('jobYear').value.trim() || '26';

            jobCardsList.forEach((card, idx) => {
                const cardNo = String(idx + 1).padStart(2, '0');
                card.serialNo = `${staffNo}-${mm}-${yy}-${cardNo}`;
            });

            renderCardsTable();
        }

        // Export to Excel Sheet (.xlsx)
        document.getElementById('exportExcelBtn').addEventListener('click', function() {
            if (jobCardsList.length === 0) return;

            const excelData = jobCardsList.map(card => ({
                "Job Card Serial No": card.serialNo,
                "Assigned Hours": card.assignedTime,
                "Actual Worked Hours (2/3)": card.actualTime,
                "Start Date & Time": card.startTime,
                "Optimal Out Date & Time": card.outTime,
                "Detailed Work Breakdown": card.breakdown.join(" | ")
            }));

            const worksheet = XLSX.utils.json_to_sheet(excelData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Monthly Job Cards");

            const staffNo = document.getElementById('staffNo').value.trim() || '13038';
            const mm = document.getElementById('jobMonth').value.trim() || '09';
            const yy = document.getElementById('jobYear').value.trim() || '26';

            XLSX.writeFile(workbook, `Job_Cards_${staffNo}_${mm}-20${yy}.xlsx`);
        });
    </script>
</body>
</html>
