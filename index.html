<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Card Time Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .container { max-width: 800px; }
        #messageBox { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .spinner {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3498db;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 flex flex-col items-center min-h-screen p-4">

    <div class="bg-white shadow-2xl rounded-2xl p-6 sm:p-8 w-full container">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-2">Job Card Time Calculator</h1>

        <div class="text-center bg-orange-100 py-2 px-4 rounded-lg mb-6">
            <p class="font-semibold text-indigo-800">Heavy Machine Shop, BLW Varanasi UP 221004</p>            
        </div>

        <form id="jobCardForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <div class="md:col-span-2 space-y-4">
                <label class="block text-sm font-medium text-gray-700">Assigned Time</label>
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label for="assignedHoursInput" class="block text-xs font-medium text-gray-500">Hours</label>
                        <input type="number" id="assignedHoursInput" step="1" min="0" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border" placeholder="e.g., 24" required>
                    </div>
                    <div class="flex-1">
                        <label for="assignedMinutesInput" class="block text-xs font-medium text-gray-500">Minutes</label>
                        <input type="number" id="assignedMinutesInput" step="1" min="0" max="59" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border" placeholder="e.g., 10" required>
                    </div>
                </div>
            </div>

            <div class="md:col-span-2 grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label for="shift" class="block text-sm font-medium text-gray-700">Initial Shift</label>
                    <select id="shift" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border" required>
                        <option value="day">Day Shift</option>
                        <option value="night">Night Shift</option>
                    </select>
                </div>
                <div>
                    <label for="dateIn" class="block text-sm font-medium text-gray-700">Start Date</label>
                    <input type="date" id="dateIn" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border" required>
                </div>
                <div>
                    <label for="timeIn" class="block text-sm font-medium text-gray-700">Start Time</label>
                    <input type="time" id="timeIn" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border" required>
                </div>
            </div>

            <div class="md:col-span-2">
                <label for="holidays" class="block text-sm font-medium text-gray-700">National Holidays (YYYY-MM-DD, comma-separated)</label>
                <input type="text" id="holidays" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border" placeholder="e.g., 2026-09-17">
            </div>

            <div class="md:col-span-2 mt-4 border-t pt-4 border-gray-200">
                <h3 class="text-lg font-medium text-gray-700 mb-2">Optional: Shift Change</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="shiftChangeDate" class="block text-sm font-medium text-gray-500">Change Date</label>
                        <input type="date" id="shiftChangeDate" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border">
                    </div>
                    <div>
                        <label for="shiftChange" class="block text-sm font-medium text-gray-500">New Shift</label>
                        <select id="shiftChange" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border">
                            <option value="">No Change</option>
                            <option value="day">Day Shift</option>
                            <option value="night">Night Shift</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="md:col-span-2 mt-4 flex flex-col sm:flex-row space-y-2 sm:space-y-0 sm:space-x-4">
                <button type="submit" id="calculateBtn" class="flex-1 bg-indigo-600 text-white font-semibold py-3 px-4 rounded-xl shadow-lg hover:bg-indigo-700 transition duration-300 flex items-center justify-center">
                    <span>Calculate 'Out' Times</span>
                </button>
                <button type="button" id="clearBtn" class="flex-1 bg-gray-300 text-gray-800 font-semibold py-3 px-4 rounded-xl shadow-lg hover:bg-gray-400 transition duration-300">
                    Clear Form
                </button>
            </div>
        </form>

        <div id="result" class="mt-8 p-6 bg-indigo-50 rounded-lg border border-indigo-200 hidden">
            <h2 class="text-xl font-semibold text-indigo-800 mb-4">Calculated Job Card Data</h2>
            <div class="space-y-3 text-indigo-700">
                <p><strong>Actual Hours to Fill:</strong> <span id="out_incentiveHours" class="font-bold"></span></p>
                <p><strong>Start Date & Time:</strong> <span id="out_inTime" class="font-bold"></span></p>
            </div>
            <div class="mt-6">
                <h3 class="text-lg font-semibold text-indigo-800 mb-2">Work Schedule Breakdown:</h3>
                <ul id="workBreakdown" class="space-y-2 text-sm text-gray-700 list-disc list-inside max-h-48 overflow-y-auto pr-2"></ul>
            </div>
            <div class="mt-6 border-t pt-4 border-indigo-200 text-center">
                <p class="text-sm">Optimal Out Time: <strong id="out_outTime" class="block text-indigo-900 text-lg"></strong></p>
                <p class="text-sm mt-2">Rounded Out Time: <strong id="out_roundedOutTime" class="block text-green-700 text-lg"></strong></p>
            </div>
            <div class="mt-4">
                <button id="saveBtn" class="w-full bg-green-600 text-white font-semibold py-2 px-4 rounded-xl shadow-lg hover:bg-green-700 transition duration-300 flex items-center justify-center disabled:bg-gray-400">
                    <span>Save This Job Card</span>
                </button>
            </div>
        </div>

        <div class="mt-10">
            <h2 class="text-2xl font-bold text-center text-gray-800 mb-4">Saved Job Cards</h2>
            <div id="savedJobCards" class="space-y-4"></div>
            <button id="exportBtn" class="mt-4 w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-xl shadow-lg hover:bg-blue-700 transition duration-300">
                Export Data to CSV
            </button>
        </div>

        <div id="messageBox" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 hidden">
            <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-sm">
                <h3 id="messageTitle" class="text-lg font-bold mb-2"></h3>
                <p id="messageText" class="text-gray-700 mb-4"></p>
                <div class="flex justify-end">
                    <button id="closeMessage" class="text-white px-4 py-2 rounded-lg hover:opacity-90 transition">OK</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ui = {
            form: document.getElementById('jobCardForm'),
            assignedHoursInput: document.getElementById('assignedHoursInput'),
            assignedMinutesInput: document.getElementById('assignedMinutesInput'),
            shiftSelect: document.getElementById('shift'),
            dateIn: document.getElementById('dateIn'),
            timeIn: document.getElementById('timeIn'),
            holidaysInput: document.getElementById('holidays'),
            shiftChangeDateInput: document.getElementById('shiftChangeDate'),
            shiftChangeSelect: document.getElementById('shiftChange'),
            resultDiv: document.getElementById('result'),
            workBreakdownList: document.getElementById('workBreakdown'),
            savedJobCardsContainer: document.getElementById('savedJobCards'),
            calculateBtn: document.getElementById('calculateBtn'),
            saveBtn: document.getElementById('saveBtn'),
            clearBtn: document.getElementById('clearBtn'),
            exportBtn: document.getElementById('exportBtn'),
            messageBox: document.getElementById('messageBox'),
            messageTitle: document.getElementById('messageTitle'),
            messageText: document.getElementById('messageText'),
            closeMessageBtn: document.getElementById('closeMessage'),
            outIncentiveHours: document.getElementById('out_incentiveHours'),
            outInTime: document.getElementById('out_inTime'),
            outOutTime: document.getElementById('out_outTime'),
            outRoundedOutTime: document.getElementById('out_roundedOutTime')
        };

        let currentCalculationResult = null;

        const showMessage = (message, isError = true) => {
            ui.messageTitle.textContent = isError ? 'Error' : 'Success';
            ui.messageTitle.className = isError ? 'text-lg font-bold text-red-600 mb-2' : 'text-lg font-bold text-green-600 mb-2';
            ui.messageText.textContent = message;
            ui.messageBox.classList.remove('hidden');
            ui.closeMessageBtn.className = isError ? 'bg-red-500 text-white px-4 py-2 rounded-lg' : 'bg-green-500 text-white px-4 py-2 rounded-lg';
        };

        ui.closeMessageBtn.addEventListener('click', () => ui.messageBox.classList.add('hidden'));

        const roundToNearestQuarterHour = (date) => {
            const newDate = new Date(date.getTime());
            const minutes = newDate.getMinutes();
            if (minutes <= 7) newDate.setMinutes(0, 0, 0);
            else if (minutes <= 22) newDate.setMinutes(15, 0, 0);
            else if (minutes <= 37) newDate.setMinutes(30, 0, 0);
            else if (minutes <= 52) newDate.setMinutes(45, 0, 0);
            else newDate.setHours(newDate.getHours() + 1, 0, 0, 0);
            return newDate;
        };

        const formatHours = (decimalHours) => {
            if (decimalHours <= 0) return '0 minutes';
            const hours = Math.floor(decimalHours);
            const minutes = Math.round((decimalHours - hours) * 60);
            return [
                hours > 0 ? `${hours} hour${hours > 1 ? 's' : ''}` : '',
                minutes > 0 ? `${minutes} minute${minutes > 1 ? 's' : ''}` : ''
            ].filter(Boolean).join(' and ');
        };

        const formatDateTime = (date) => new Intl.DateTimeFormat('en-GB', {
            dateStyle: 'full', timeStyle: 'short', hour12: false
        }).format(date).replace(' at ', ', ');

        // --- CORE CALCULATION ENGINE WITH NIGHT SHIFT LOGIC ---
        function calculateJobCard(assignedHours, initialShift, startDateStr, startTimeStr, holidaysList, shiftChangeDateStr, newShiftType) {
            let totalMinutesRemaining = Math.round(assignedHours * 60);
            let currentPointer = new Date(`${startDateStr}T${startTimeStr}:00`);

            const holidays = holidaysList.map(h => h.trim());
            const breakdown = [];

            while (totalMinutesRemaining > 0) {
                const dayOfWeek = currentPointer.getDay(); // 0: Sun, 6: Sat
                const currentDateStr = currentPointer.toISOString().split('T')[0];

                // Determine active shift (check for shift change)
                let activeShift = initialShift;
                if (shiftChangeDateStr && newShiftType && currentDateStr >= shiftChangeDateStr) {
                    activeShift = newShiftType;
                }

                // Check Sunday or Holiday
                if (dayOfWeek === 0 || holidays.includes(currentDateStr)) {
                    // Move to next day 00:00
                    currentPointer.setDate(currentPointer.getDate() + 1);
                    currentPointer.setHours(0, 0, 0, 0);
                    continue;
                }

                // Define Shift Boundaries for current day
                let shiftStartHour = 6, shiftStartMin = 30;
                let shiftEndHour = 16, shiftEndMin = 0;
                let hasLunch = true;
                let lunchStartHour = 11, lunchStartMin = 30;
                let lunchEndHour = 12, lunchEndMin = 30;

                if (activeShift === 'night') {
                    if (dayOfWeek === 6) { // Saturday Night Shift
                        shiftStartHour = 12; shiftStartMin = 0;
                        shiftEndHour = 17; shiftEndMin = 0;
                        hasLunch = false;
                    } else { // Weekday Night Shift (16:00 to 01:30 next day)
                        shiftStartHour = 16; shiftStartMin = 0;
                        shiftEndHour = 25; shiftEndMin = 30; // 25:30 represents 01:30 AM next day
                        hasLunch = true;
                        lunchStartHour = 21; lunchStartMin = 0;
                        lunchEndHour = 22; lunchEndMin = 0;
                    }
                } else if (dayOfWeek === 6) { // Saturday Day Shift
                    shiftEndHour = 12; shiftEndMin = 0;
                    hasLunch = false;
                }

                // Convert current time to relative minutes from shift start
                let currentHour = currentPointer.getHours();
                let currentMin = currentPointer.getMinutes();
                
                // Adjust for early morning times (00:00 - 01:30) in night shift
                if (activeShift === 'night' && dayOfWeek !== 6 && currentHour < 2) {
                    currentHour += 24;
                }

                let currentRelMin = currentHour * 60 + currentMin;
                let startRelMin = shiftStartHour * 60 + shiftStartMin;
                let endRelMin = shiftEndHour * 60 + shiftEndMin;
                let lunchStartRelMin = lunchStartHour * 60 + lunchStartMin;
                let lunchEndRelMin = lunchEndHour * 60 + lunchEndMin;

                // If before shift start, jump to shift start
                if (currentRelMin < startRelMin) {
                    currentRelMin = startRelMin;
                    let realHour = Math.floor(startRelMin / 60) % 24;
                    currentPointer.setHours(realHour, startRelMin % 60, 0, 0);
                }

                // If past shift end, jump to next day
                if (currentRelMin >= endRelMin) {
                    currentPointer.setDate(currentPointer.getDate() + 1);
                    currentPointer.setHours(0, 0, 0, 0);
                    continue;
                }

                // Handle Lunch Break Skip
                if (hasLunch && currentRelMin >= lunchStartRelMin && currentRelMin < lunchEndRelMin) {
                    currentRelMin = lunchEndRelMin;
                    let realHour = Math.floor(lunchEndRelMin / 60) % 24;
                    currentPointer.setHours(realHour, lunchEndRelMin % 60, 0, 0);
                }

                // Calculate available working minutes in this block
                let nextBoundary = endRelMin;
                if (hasLunch && currentRelMin < lunchStartRelMin) {
                    nextBoundary = lunchStartRelMin;
                }

                let availableMins = nextBoundary - currentRelMin;
                let minsToWork = Math.min(totalMinutesRemaining, availableMins);

                // Record work block
                const shiftLabel = activeShift === 'night' ? 'Night Shift' : 'Day Shift';
                const dayName = new Intl.DateTimeFormat('en-US', { weekday: 'short' }).format(currentPointer);
                const dateFormatted = `${dayName}, ${currentPointer.getDate()} ${new Intl.DateTimeFormat('en-US', { month: 'short' }).format(currentPointer)} ${currentPointer.getFullYear()}`;

                breakdown.push({
                    text: `${dateFormatted} (${shiftLabel}): Worked ${formatHours(minsToWork / 60)}`
                });

                totalMinutesRemaining -= minsToWork;
                currentRelMin += minsToWork;

                // Update currentPointer
                let realHour = Math.floor(currentRelMin / 60) % 24;
                let realMin = currentRelMin % 60;
                if (currentRelMin >= 24 * 60) {
                    if (currentPointer.getHours() >= 16) {
                        currentPointer.setDate(currentPointer.getDate() + 1);
                    }
                }
                currentPointer.setHours(realHour, realMin, 0, 0);
            }

            return {
                inTime: new Date(`${startDateStr}T${startTimeStr}:00`),
                outTime: currentPointer,
                roundedOutTime: roundToNearestQuarterHour(currentPointer),
                breakdown: breakdown,
                assignedHours: assignedHours
            };
        }

        // --- FORM SUBMISSION & EVENT HANDLERS ---
        ui.form.addEventListener('submit', (e) => {
            e.preventDefault();

            const hours = parseInt(ui.assignedHoursInput.value) || 0;
            const minutes = parseInt(ui.assignedMinutesInput.value) || 0;
            const assignedHours = hours + (minutes / 60);

            if (assignedHours <= 0) {
                showMessage("Please enter valid assigned time.");
                return;
            }

            const holidays = ui.holidaysInput.value ? ui.holidaysInput.value.split(',') : [];

            currentCalculationResult = calculateJobCard(
                assignedHours,
                ui.shiftSelect.value,
                ui.dateIn.value,
                ui.timeIn.value,
                holidays,
                ui.shiftChangeDateInput.value,
                ui.shiftChangeSelect.value
            );

            // Display Results
            ui.outIncentiveHours.textContent = formatHours(assignedHours);
            ui.outInTime.textContent = formatDateTime(currentCalculationResult.inTime);
            ui.outOutTime.textContent = formatDateTime(currentCalculationResult.outTime);
            ui.outRoundedOutTime.textContent = formatDateTime(currentCalculationResult.roundedOutTime);

            ui.workBreakdownList.innerHTML = currentCalculationResult.breakdown
                .map(item => `<li>${item.text}</li>`).join('');

            ui.resultDiv.classList.remove('hidden');
        });

        ui.clearBtn.addEventListener('click', () => {
            ui.form.reset();
            ui.resultDiv.classList.add('hidden');
            currentCalculationResult = null;
        });

        // LocalStorage Logic
        function loadJobCards() {
            const cards = JSON.parse(localStorage.getItem('jobCards')) || [];
            ui.savedJobCardsContainer.innerHTML = cards.length === 0 
                ? `<p class="text-center text-gray-500 py-4">No Saved Cards</p>`
                : cards.map((card, i) => `
                    <div class="bg-gray-50 p-4 rounded-lg border flex justify-between items-center">
                        <div>
                            <h4 class="font-bold">Job Card #${i + 1}</h4>
                            <p class="text-sm">In: ${formatDateTime(new Date(card.inTime))}</p>
                            <p class="text-sm">Out: ${formatDateTime(new Date(card.roundedOutTime))}</p>
                        </div>
                        <button onclick="deleteCard(${i})" class="text-red-500 hover:text-red-700 font-bold">Delete</button>
                    </div>
                `).join('');
        }

        ui.saveBtn.addEventListener('click', () => {
            if (!currentCalculationResult) return;
            const cards = JSON.parse(localStorage.getItem('jobCards')) || [];
            cards.push(currentCalculationResult);
            localStorage.setItem('jobCards', JSON.stringify(cards));
            loadJobCards();
            showMessage("Job card saved successfully!", false);
        });

        window.deleteCard = (index) => {
            const cards = JSON.parse(localStorage.getItem('jobCards')) || [];
            cards.splice(index, 1);
            localStorage.setItem('jobCards', JSON.stringify(cards));
            loadJobCards();
        };

        ui.exportBtn.addEventListener('click', () => {
            const cards = JSON.parse(localStorage.getItem('jobCards')) || [];
            if (!cards.length) return showMessage("No data to export.");

            let csv = "Sr. No.,Assigned Hours,Start Time,Rounded Out Time\n";
            cards.forEach((c, i) => {
                csv += `${i + 1},${c.assignedHours},"${formatDateTime(new Date(c.inTime))}","${formatDateTime(new Date(c.roundedOutTime))}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'job_cards.csv';
            a.click();
        });

        loadJobCards();
    </script>
</body>
</html>
